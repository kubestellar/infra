apiVersion: v1
kind: ServiceAccount
metadata:
  name: gcsweb
  namespace: __PROW_NAMESPACE__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: gcsweb
  name: gcsweb
  namespace: __PROW_NAMESPACE__
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: gcsweb
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        fluentbit.io/parser: json_iso
      labels:
        app: gcsweb
    spec:
      containers:
      - args:
        - -s3-credentials-file=/etc/s3-credentials/service-account.json
        - -b=s3://prow-data
        image: gcr.io/k8s-prow/gcsweb:v20240731-a5d9345e59
        imagePullPolicy: IfNotPresent
        name: gcsweb
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        volumeMounts:
        - mountPath: /etc/s3-credentials
          name: s3-credentials
          readOnly: true
      nodeSelector:
        kubermatic.io/stable: 'true'
      serviceAccount: gcsweb
      serviceAccountName: gcsweb
      terminationGracePeriodSeconds: 5
      tolerations:
      - key: kubermatic.io/stable
        operator: Exists
      volumes:
      - name: s3-credentials
        secret:
          secretName: s3-credentials-internal
---
apiVersion: v1
kind: Service
metadata:
  name: gcsweb
  namespace: __PROW_NAMESPACE__
spec:
  ports:
  - port: 80
    protocol: TCP
    targetPort: 8080
  selector:
    app: gcsweb
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    ingress.kubernetes.io/force-ssl-redirect: 'true'
    kubernetes.io/ingress.class: nginx
    kubernetes.io/tls-acme: 'true'
  name: gcsweb
  namespace: __PROW_NAMESPACE__
spec:
  rules:
  - host: gcsweb.kcp.k8c.io
    http:
      paths:
      - backend:
          service:
            name: gcsweb
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - gcsweb.kcp.k8c.io
    secretName: gcsweb-tls
