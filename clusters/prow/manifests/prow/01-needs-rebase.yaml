apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: needs-rebase
  name: needs-rebase
  namespace: __PROW_NAMESPACE__
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: needs-rebase
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: needs-rebase
    spec:
      containers:
      - args:
        - --dry-run=false
        - --github-endpoint=http://ghproxy
        - --github-endpoint=https://api.github.com
        - --github-app-id=$(GITHUB_APP_ID)
        - --github-app-private-key-path=/etc/github/cert
        - --update-period=6h
        - --hmac-secret-file=/etc/github-hmac/token
        env:
        - name: GITHUB_APP_ID
          valueFrom:
            secretKeyRef:
              key: appid
              name: github-token
        image: us-docker.pkg.dev/k8s-infra-prow/images/needs-rebase:v20260430-7dfdc18c1
        imagePullPolicy: Always
        name: needs-rebase
        ports:
        - containerPort: 8888
          name: http
          protocol: TCP
        volumeMounts:
        - mountPath: /etc/github-hmac
          name: github-hmac
          readOnly: true
        - mountPath: /etc/github
          name: github
          readOnly: true
        - mountPath: /etc/plugins
          name: plugins
          readOnly: true
      nodeSelector:
        kubermatic.io/stable: 'true'
      terminationGracePeriodSeconds: 180
      tolerations:
      - key: kubermatic.io/stable
        operator: Exists
      volumes:
      - name: github-hmac
        secret:
          secretName: github-hmac-token
      - name: github
        secret:
          secretName: github-token
      - configMap:
          name: plugins
        name: plugins
---
apiVersion: v1
kind: Service
metadata:
  name: needs-rebase
  namespace: __PROW_NAMESPACE__
spec:
  ports:
  - port: 80
    protocol: TCP
    targetPort: 8888
  selector:
    app: needs-rebase
  type: ClusterIP
