apiVersion: v1
kind: ServiceAccount
metadata:
  name: sinker
  namespace: __PROW_NAMESPACE__
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sinker
  namespace: __PROW_NAMESPACE__
rules:
- apiGroups:
  - prow.k8s.io
  resources:
  - prowjobs
  verbs:
  - delete
  - list
  - watch
  - get
- apiGroups:
  - coordination.k8s.io
  resourceNames:
  - prow-sinker-leaderlock
  resources:
  - leases
  verbs:
  - get
  - update
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
- apiGroups:
  - ''
  resourceNames:
  - prow-sinker-leaderlock
  resources:
  - configmaps
  verbs:
  - get
  - update
- apiGroups:
  - ''
  resources:
  - configmaps
  - events
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sinker
  namespace: __PROW_TESTPOD_NAMESPACE__
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - delete
  - list
  - watch
  - get
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sinker
  namespace: __PROW_NAMESPACE__
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sinker
subjects:
- kind: ServiceAccount
  name: sinker
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sinker
  namespace: __PROW_TESTPOD_NAMESPACE__
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sinker
subjects:
- kind: ServiceAccount
  name: sinker
  namespace: __PROW_NAMESPACE__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: sinker
  name: sinker
  namespace: __PROW_NAMESPACE__
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: sinker
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: sinker
    spec:
      containers:
      - args:
        - --kubeconfig=/etc/kubeconfigs/kubeconfig
        - --config-path=/etc/config/config.yaml
        - --job-config-path=/etc/job-config
        - --dry-run=false
        image: us-docker.pkg.dev/k8s-infra-prow/images/sinker:v20260430-7dfdc18c1
        imagePullPolicy: IfNotPresent
        name: sinker
        ports:
        - containerPort: 9090
          name: metrics
          protocol: TCP
        volumeMounts:
        - mountPath: /etc/config
          name: config
          readOnly: true
        - mountPath: /etc/job-config
          name: job-config
          readOnly: true
        - mountPath: /etc/kubeconfigs
          name: kubeconfig
          readOnly: true
      nodeSelector:
        kubermatic.io/stable: 'true'
      serviceAccount: sinker
      serviceAccountName: sinker
      terminationGracePeriodSeconds: 30
      tolerations:
      - key: kubermatic.io/stable
        operator: Exists
      volumes:
      - configMap:
          name: config
        name: config
      - configMap:
          name: job-config
        name: job-config
      - name: kubeconfig
        secret:
          secretName: kubeconfig
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: sinker
  name: sinker
  namespace: __PROW_NAMESPACE__
spec:
  ports:
  - name: metrics
    port: 9090
    protocol: TCP
    targetPort: 9090
  selector:
    app: sinker
  type: ClusterIP
