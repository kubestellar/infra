apiVersion: v1
kind: ServiceAccount
metadata:
  name: deck
  namespace: __PROW_NAMESPACE__
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deck
  namespace: __PROW_NAMESPACE__
rules:
- apiGroups:
  - prow.k8s.io
  resources:
  - prowjobs
  verbs:
  - get
  - list
  - watch
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deck
  namespace: __PROW_TESTPOD_NAMESPACE__
rules:
- apiGroups:
  - ''
  resources:
  - pods/log
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deck
  namespace: __PROW_NAMESPACE__
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deck
subjects:
- kind: ServiceAccount
  name: deck
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deck
  namespace: __PROW_TESTPOD_NAMESPACE__
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deck
subjects:
- kind: ServiceAccount
  name: deck
  namespace: __PROW_NAMESPACE__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: deck
  name: deck
  namespace: __PROW_NAMESPACE__
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: deck
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: deck
    spec:
      containers:
      - args:
        - --config-path=/etc/config/config.yaml
        - --plugin-config=/etc/plugins/plugins.yaml
        - --tide-url=http://tide/
        - --hook-url=http://hook:8888/plugin-help
        - --github-endpoint=http://ghproxy
        - --github-endpoint=https://api.github.com
        - --github-graphql-endpoint=http://ghproxy/graphql
        - --s3-credentials-file=/etc/s3-credentials/service-account.json
        - --spyglass=true
        - --github-app-id=$(GITHUB_APP_ID)
        - --github-app-private-key-path=/etc/github/cert
        env:
        - name: MINIO_SERVER_URL
          value: https://minio.kubestellar.io
        image: us-docker.pkg.dev/k8s-infra-prow/images/deck:v20260430-7dfdc18c1
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 8081
            scheme: HTTP
          initialDelaySeconds: 3
          periodSeconds: 3
          successThreshold: 1
          timeoutSeconds: 1
        name: deck
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz/ready
            port: 8081
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 3
          successThreshold: 1
          timeoutSeconds: 600
        resources:
          limits:
            cpu: '1'
            memory: 2Gi
          requests:
            cpu: 200m
            memory: 512Mi
        volumeMounts:
        - mountPath: /etc/config
          name: config
          readOnly: true
        - mountPath: /etc/github
          name: github
          readOnly: true
        - mountPath: /etc/plugins
          name: plugins
          readOnly: true
        - mountPath: /etc/s3-credentials
          name: s3-credentials
          readOnly: true
      nodeSelector:
        kubermatic.io/stable: 'true'
      serviceAccount: deck
      serviceAccountName: deck
      terminationGracePeriodSeconds: 30
      tolerations:
      - key: kubermatic.io/stable
        operator: Exists
      volumes:
      - configMap:
          name: config
        name: config
      - name: github
        secret:
          secretName: github-token
      - configMap:
          name: plugins
        name: plugins
      - name: s3-credentials
        secret:
          secretName: s3-credentials-internal
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: deck
  name: deck
  namespace: __PROW_NAMESPACE__
spec:
  externalTrafficPolicy: Cluster
  ports:
  - name: main
    nodePort: 30528
    port: 80
    protocol: TCP
    targetPort: 8080
  - name: metrics
    nodePort: 31757
    port: 9090
    protocol: TCP
    targetPort: 9090
  selector:
    app: deck
  type: NodePort
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    ingress.kubernetes.io/force-ssl-redirect: 'true'
    kubernetes.io/ingress.class: nginx
    kubernetes.io/tls-acme: 'true'
  name: deck
  namespace: __PROW_NAMESPACE__
spec:
  rules:
  - host: prow.kcp.k8c.io
    http:
      paths:
      - backend:
          service:
            name: deck
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - prow.kcp.k8c.io
    secretName: deck-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/auth-realm: Authentication Required
    nginx.ingress.kubernetes.io/auth-secret: prow-auth
    nginx.ingress.kubernetes.io/auth-type: basic
  name: prow-private
  namespace: __PROW_NAMESPACE__
spec:
  rules:
  - host: prow2-private.kubestellar.io
    http:
      paths:
      - backend:
          service:
            name: deck
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - prow2-private.kubestellar.io
    secretName: tls-private-secret
