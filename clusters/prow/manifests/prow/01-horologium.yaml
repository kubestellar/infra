apiVersion: v1
kind: ServiceAccount
metadata:
  name: horologium
  namespace: __PROW_NAMESPACE__
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: horologium
  namespace: __PROW_NAMESPACE__
rules:
- apiGroups:
  - prow.k8s.io
  resources:
  - prowjobs
  verbs:
  - create
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: horologium
  namespace: __PROW_NAMESPACE__
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: horologium
subjects:
- kind: ServiceAccount
  name: horologium
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: horologium
  name: horologium
  namespace: __PROW_NAMESPACE__
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: horologium
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: horologium
    spec:
      containers:
      - args:
        - --config-path=/etc/config/config.yaml
        - --job-config-path=/etc/job-config
        - --dry-run=false
        image: us-docker.pkg.dev/k8s-infra-prow/images/horologium:v20260430-7dfdc18c1
        imagePullPolicy: IfNotPresent
        name: horologium
        ports:
        - containerPort: 9090
          name: metrics
          protocol: TCP
        volumeMounts:
        - mountPath: /etc/config
          name: config
          readOnly: true
        - mountPath: /etc/job-config
          name: job-config
          readOnly: true
      nodeSelector:
        kubermatic.io/stable: 'true'
      serviceAccount: horologium
      serviceAccountName: horologium
      terminationGracePeriodSeconds: 30
      tolerations:
      - key: kubermatic.io/stable
        operator: Exists
      volumes:
      - configMap:
          name: config
        name: config
      - configMap:
          name: job-config
        name: job-config
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: horologium
  name: horologium
  namespace: __PROW_NAMESPACE__
spec:
  ports:
  - name: metrics
    port: 9090
    protocol: TCP
    targetPort: 9090
  selector:
    app: horologium
  type: ClusterIP
