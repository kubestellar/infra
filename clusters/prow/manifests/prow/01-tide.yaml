apiVersion: v1
kind: ServiceAccount
metadata:
  name: tide
  namespace: __PROW_NAMESPACE__
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tide
  namespace: __PROW_NAMESPACE__
rules:
- apiGroups:
  - prow.k8s.io
  resources:
  - prowjobs
  verbs:
  - create
  - list
  - get
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tide
  namespace: __PROW_NAMESPACE__
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tide
subjects:
- kind: ServiceAccount
  name: tide
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: tide
  name: tide
  namespace: __PROW_NAMESPACE__
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: tide
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: tide
    spec:
      containers:
      - args:
        - --dry-run=false
        - --github-endpoint=http://ghproxy
        - --github-endpoint=https://api.github.com
        - --github-app-id=$(GITHUB_APP_ID)
        - --github-app-private-key-path=/etc/github/cert
        - --config-path=/etc/config/config.yaml
        - --job-config-path=/etc/job-config
        - --history-uri=s3://prow-data/tide-history.json
        - --status-path=s3://prow-data/tide-status-checkpoint.yaml
        - --s3-credentials-file=/etc/s3-credentials/service-account.json
        env:
        - name: GITHUB_APP_ID
          valueFrom:
            secretKeyRef:
              key: appid
              name: github-token
        image: us-docker.pkg.dev/k8s-infra-prow/images/tide:v20260430-7dfdc18c1
        imagePullPolicy: IfNotPresent
        name: tide
        ports:
        - containerPort: 8888
          name: http
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP
        volumeMounts:
        - mountPath: /etc/github
          name: github
          readOnly: true
        - mountPath: /etc/config
          name: config
          readOnly: true
        - mountPath: /etc/job-config
          name: job-config
          readOnly: true
        - mountPath: /etc/s3-credentials
          name: s3-credentials
          readOnly: true
      nodeSelector:
        kubermatic.io/stable: 'true'
      serviceAccount: tide
      serviceAccountName: tide
      terminationGracePeriodSeconds: 30
      tolerations:
      - key: kubermatic.io/stable
        operator: Exists
      volumes:
      - name: github
        secret:
          secretName: github-token
      - configMap:
          name: config
        name: config
      - configMap:
          name: job-config
        name: job-config
      - name: s3-credentials
        secret:
          secretName: s3-credentials-internal
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: tide
  name: tide
  namespace: __PROW_NAMESPACE__
spec:
  ports:
  - name: main
    port: 80
    protocol: TCP
    targetPort: 8888
  - name: metrics
    port: 9090
    protocol: TCP
    targetPort: 9090
  selector:
    app: tide
  type: ClusterIP
