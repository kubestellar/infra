apiVersion: v1
kind: ServiceAccount
metadata:
  name: hook
  namespace: __PROW_NAMESPACE__
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hook
  namespace: __PROW_NAMESPACE__
rules:
- apiGroups:
  - prow.k8s.io
  resources:
  - prowjobs
  verbs:
  - create
  - get
  - list
  - update
- apiGroups:
  - ''
  resources:
  - configmaps
  verbs:
  - create
  - get
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hook
  namespace: __PROW_NAMESPACE__
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hook
subjects:
- kind: ServiceAccount
  name: hook
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: hook
  name: hook
  namespace: __PROW_NAMESPACE__
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: hook
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: hook
    spec:
      containers:
      - args:
        - --dry-run=false
        - --config-path=/etc/config/config.yaml
        - --github-endpoint=http://ghproxy
        - --github-endpoint=https://api.github.com
        - --github-app-id=$(GITHUB_APP_ID)
        - --github-app-private-key-path=/etc/github/cert
        - --job-config-path=/etc/job-config
        env:
        - name: GITHUB_APP_ID
          valueFrom:
            secretKeyRef:
              key: appid
              name: github-token
        image: us-docker.pkg.dev/k8s-infra-prow/images/hook:v20260430-7dfdc18c1
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 8081
            scheme: HTTP
          initialDelaySeconds: 3
          periodSeconds: 3
          successThreshold: 1
          timeoutSeconds: 1
        name: hook
        ports:
        - containerPort: 8888
          name: http
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz/ready
            port: 8081
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 3
          successThreshold: 1
          timeoutSeconds: 1
        volumeMounts:
        - mountPath: /etc/webhook
          name: hmac
          readOnly: true
        - mountPath: /etc/github
          name: github
          readOnly: true
        - mountPath: /etc/config
          name: config
          readOnly: true
        - mountPath: /etc/plugins
          name: plugins
          readOnly: true
        - mountPath: /etc/job-config
          name: job-config
          readOnly: true
      nodeSelector:
        kubermatic.io/stable: 'true'
      serviceAccount: hook
      serviceAccountName: hook
      terminationGracePeriodSeconds: 180
      tolerations:
      - key: kubermatic.io/stable
        operator: Exists
      volumes:
      - name: hmac
        secret:
          secretName: hmac-token
      - name: github
        secret:
          secretName: github-token
      - configMap:
          name: config
        name: config
      - configMap:
          name: plugins
        name: plugins
      - configMap:
          name: job-config
        name: job-config
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: hook
  name: hook
  namespace: __PROW_NAMESPACE__
spec:
  externalTrafficPolicy: Cluster
  ports:
  - name: main
    nodePort: 31771
    port: 8888
    protocol: TCP
    targetPort: 8888
  - name: metrics
    nodePort: 31538
    port: 9090
    protocol: TCP
    targetPort: 9090
  selector:
    app: hook
  type: NodePort
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    ingress.kubernetes.io/force-ssl-redirect: 'true'
    kubernetes.io/ingress.class: nginx
    kubernetes.io/tls-acme: 'true'
  name: hook
  namespace: __PROW_NAMESPACE__
spec:
  rules:
  - host: prow.kcp.k8c.io
    http:
      paths:
      - backend:
          service:
            name: hook
            port:
              number: 8888
        path: /hook
        pathType: Prefix
  tls:
  - hosts:
    - prow.kcp.k8c.io
    secretName: hook-tls
