---
periodics:
  - name: ci-infra-prow-labelsync
    cron: "17 * * * *" # Every hour at 17 minutes past the hour
    cluster: default
    decorate: true
    labels:
      app: label-sync
    extra_refs:
    - org: kubestellar
      repo: infra
      base_ref: main
      clone_uri: "https://github.com/kubestellar/infra.git"
    spec:
      containers:
      # AUDIT MODE (--confirm=false): label_sync has no create/update-only mode
      # and deletes every label that is not listed in prow/labels.yaml. Run with
      # --confirm=true it would delete roughly 990 existing labels across the
      # kubestellar repos (bug, enhancement, agent/*, ...). Keep this job
      # non-mutating until labels.yaml is a superset of the labels in use.
      # Dry-run mode cannot use GitHub App auth ("not requesting GitHub App
      # access_token in dry-run mode"), so it uses the token secret.
      # kubestellar/docs is skipped: it has a label (sentinel-alert) whose
      # description exceeds label_sync's 100 byte limit, which aborts the run.
      - image: gcr.io/k8s-prow/label_sync:v20240731-a5d9345e59
        command:
        - label_sync
        args:
        - --config=/home/prow/go/src/github.com/kubestellar/infra/prow/labels.yaml
        - --confirm=false
        - --orgs=kubestellar
        - --skip=kubestellar/docs
        - --github-token-path=/etc/github/token
        volumeMounts:
        - name: labelsync-token
          mountPath: /etc/github
          readOnly: true
      volumes:
      - name: labelsync-token
        secret:
          secretName: github-oauth-token

  - name: ci-infra-prow-autobump
    cron: "30 3 * * 1"  # Weekly on Monday at 3:30 AM UTC
    cluster: default
    decorate: true
    labels:
      app: autobumper
    extra_refs:
    - org: kubestellar
      repo: infra
      base_ref: main
      clone_uri: "https://github.com/kubestellar/infra.git"
    spec:
      containers:
      - image: us-docker.pkg.dev/k8s-infra-prow/images/generic-autobumper:v20260109-e821f0db6
        command:
        - generic-autobumper
        args:
        - --config=/home/prow/go/src/github.com/kubestellar/infra/prow/autobump-config.yaml
        volumeMounts:
        - name: github-app-key
          mountPath: /etc/github-token
          readOnly: true
      volumes:
      - name: github-app-key
        secret:
          secretName: github-token
