presubmits:
  kubestellar/infra:
    - name: pull-infra-validate-prow-yaml
      always_run: true
      decorate: true
      clone_uri: "https://github.com/kubestellar/infra.git"
      spec:
        containers:
          - image: us-docker.pkg.dev/k8s-infra-prow/images/checkconfig:v20260109-e821f0db6
            command:
              - checkconfig
            args:
              - -plugin-config=/home/prow/go/src/github.com/kubestellar/infra/prow/plugins.yaml
              - -config-path=/home/prow/go/src/github.com/kubestellar/infra/prow/config.yaml
              - -job-config-path=/home/prow/go/src/github.com/kubestellar/infra/prow/jobs
              - -prow-yaml-repo-name=$(REPO_OWNER)/$(REPO_NAME)

    - name: pull-infra-validate-prow-jobs
      decorate: true
      clone_uri: "https://github.com/kubestellar/infra.git"
      run_if_changed: "prow/jobs/"
      branches:
        - ^main$
      spec:
        containers:
          - image: us-docker.pkg.dev/k8s-infra-prow/images/checkconfig:v20260109-e821f0db6
            command:
              - checkconfig
            args:
              - -plugin-config=/home/prow/go/src/github.com/kubestellar/infra/prow/plugins.yaml
              - -config-path=/home/prow/go/src/github.com/kubestellar/infra/prow/config.yaml
              - -job-config-path=/home/prow/go/src/github.com/kubestellar/infra/prow/jobs
              - -strict

    - name: pull-infra-prow-labelsync
      cluster: default
      labels:
        app: label-sync
      decorate: true
      clone_uri: "https://github.com/kubestellar/infra.git"
      run_if_changed: '^prow/labels.yaml$'
      spec:
        containers:
        - image: gcr.io/k8s-prow/label_sync:v20230523-2834e18241
          command:
          - label_sync
          args:
          - --config=/home/prow/go/src/github.com/kubestellar/infra/prow/labels.yaml
          - --orgs=kubestellar
          - --token=/etc/oauth-token/token
          - --endpoint=http://ghproxy.prow.svc.cluster.local
          - --endpoint=https://api.github.com
          - --debug
          volumeMounts:
          - name: oauth-token
            mountPath: /etc/oauth-token
            readOnly: true
        volumes:
        - name: oauth-token
          secret:
            secretName: github-token

    # Image build checks. These used to live in the repo's .prow.yaml; they
    # are static because in-repo config is disabled for kubestellar/infra
    # (see in_repo_config in prow/config.yaml).
    - name: pull-infra-images-1.23-build
      decorate: true
      clone_uri: "https://github.com/kubestellar/infra.git"
      run_if_changed: '^images/build/go-1.23'
      labels:
        preset-goproxy: "true"
      spec:
        containers:
          - image: quay.io/containers/buildah:v1.40.1
            command:
              - images/build/hack/build-image.sh
              - go-1.23
            # docker-in-docker needs privileged mode
            securityContext:
              privileged: true
            env:
              - name: DRY_RUN
                value: '1'
            resources:
              requests:
                memory: 1Gi
                cpu: 1

